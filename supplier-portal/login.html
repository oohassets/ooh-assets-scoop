<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOOP Supplier Portal — Sign In</title>
<link rel="icon" type="image/png" href="../images/scooplogo_black_192x192.png">
<link rel="stylesheet" href="./css/portal.css">
</head>
<body>

<div class="sp-login-bg"></div>

<button class="sp-theme-toggle" id="spThemeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">
  <span id="spThemeIcon">&#9789;</span>
</button>

<div class="sp-login-wrap">
  <div class="sp-login-card">
    <h1 class="sp-login-title">Supplier Portal</h1>
    <p class="sp-login-sub">Sign in to view static asset campaign bookings.</p>

    <div class="sp-field">
      <label for="spEmail">Username</label>
      <div class="sp-field-wrap">
        <span class="material-symbols-outlined sp-field-icon">person</span>
        <input id="spEmail" class="sp-field-input" type="email" autocomplete="username" placeholder="Enter your username">
      </div>
    </div>
    <div class="sp-field">
      <label for="spPassword">Password</label>
      <div class="sp-field-wrap sp-has-toggle">
        <span class="material-symbols-outlined sp-field-icon">key</span>
        <input id="spPassword" class="sp-field-input" type="password" autocomplete="current-password" placeholder="Enter your password">
        <button class="sp-pw-toggle" id="spPwToggle" type="button" aria-label="Toggle password visibility">
          <span class="material-symbols-outlined">visibility</span>
        </button>
      </div>
    </div>

    <p class="sp-login-msg" id="spLoginMsg"></p>

    <button class="sp-login-btn sp-login-btn-hidden" id="spLoginBtn" type="button">
      Sign In
      <span class="sp-btn-arrow">→</span>
    </button>
  </div>
</div>

<script type="module" src="./js/portal-theme.js"></script>
<script type="module" src="./js/portal-login.js"></script>

</body>
</html>
